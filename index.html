<title>Min musik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
:root{
  --band:#2C2F6E; --band2:#43479A; --bandtxt:#F2F2FF;
  --bg:#E1E3F3; --tint:#CFD2EC; --paper:#F3F4FC; --ink:#1B1D42; --mut:#4F5383; --faint:#7E81AE; --line:#C6C9E6;
  --acc:#3E43A6; --accbg:#D4D7F2; --heartoff:#B3B6DA; --red:#B04A3E; --green:#3F7D55; --heart:#C0506A;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px); --navh:56px;
  --font:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",-apple-system,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --band:#16183D; --band2:#2C3070; --bandtxt:#ECEDFF;
    --bg:#1C1F45; --tint:#262A5C; --paper:#222652; --ink:#E9EAFB; --mut:#ADB0DA; --faint:#8487B8; --line:#353A72;
    --acc:#AEB2FA; --accbg:#2E3378; --heartoff:#4C5090; --red:#EE9A8E; --green:#98CFA8; --heart:#EE9AB0; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:4px}
#app,#sheetc{zoom:var(--z,1)}
a{color:var(--acc)}

header{position:sticky;top:0;z-index:5;background:var(--band);color:var(--bandtxt);padding:calc(var(--safe-t) + 16px) 20px 14px}
header > *{max-width:720px;margin-left:auto;margin-right:auto}
.hdrrow{display:flex;align-items:center;gap:10px}
header h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.2px;flex:1}
.hdrbtn{border:1px solid rgba(255,255,255,.25);background:none;color:var(--bandtxt);border-radius:8px;padding:5px 10px;font-size:14px}
header .sub{color:var(--bandtxt);opacity:.75;font-size:14px;margin-top:2px}
main{padding:0 20px calc(var(--navh) + 30px + var(--safe-b));max-width:760px;margin:0 auto}
body.hasplayer main{padding-bottom:calc(var(--navh) + 100px + var(--safe-b))}

nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;gap:4px;background:var(--band);padding:8px 8px calc(8px + var(--safe-b))}
nav.bottom button{border:0;background:none;flex:1;max-width:140px;text-align:center;color:var(--bandtxt);opacity:.72;font-size:14px;padding:8px 0;border-radius:8px}
nav.bottom .on{opacity:1;font-weight:700;background:var(--band2)}

h2{font-size:20px;font-weight:700;margin:30px 0 6px;letter-spacing:-.1px}
h2 small{font-size:14px;font-weight:400;color:var(--mut);margin-left:8px}
h4{font-size:14px;font-weight:700;color:var(--mut);margin:16px 0 8px}
.fold-head{cursor:pointer;user-select:none;display:flex;align-items:baseline;gap:10px}
.fold-head::before{content:"";width:8px;height:8px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:rotate(-45deg);transition:transform .15s;flex:none;position:relative;top:-2px}
.fold-head[aria-expanded="true"]::before{transform:rotate(45deg);top:-4px}
h2.fold-head{background:var(--tint);border-radius:10px;padding:12px 14px;margin:14px 0 0}
h2.fold-head small{margin-left:auto;color:var(--faint)}
h2.fold-head[aria-expanded="true"]{border-radius:10px 10px 0 0}
.fold-body{background:var(--paper);border-radius:0 0 10px 10px;padding:4px 14px 10px}

/* Låtrader */
.trk{display:flex;gap:12px;align-items:center;padding:10px 0 10px 10px;border-bottom:1px solid var(--line);border-left:4px solid var(--g,var(--line));cursor:pointer}
.fold-body .trk:last-of-type{border-bottom:0}
.trk .grow{flex:1;min-width:0}
.trk .t{font-size:16px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk .m{font-size:14px;color:var(--mut);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk .m a,.mini .m a{color:inherit;text-decoration:none}
.trk .m a:hover{text-decoration:underline}
.trk.now .t{color:var(--acc)}
.rank{flex:none;width:20px;font-size:15px;font-weight:700;color:var(--faint);text-align:right}
.cov{width:52px;height:52px;border-radius:6px;overflow:hidden;flex:none;background:hsl(var(--h,240) 32% 52%);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px}
.cov img{width:100%;height:100%;object-fit:cover;display:block}
.reason{font-size:14px;color:var(--acc);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.racts{display:flex;align-items:center;gap:2px;flex:none}
.ib{border:0;background:none;color:var(--mut);padding:6px;line-height:0;border-radius:50%}
.ib:hover{color:var(--ink);background:var(--accbg)}
.ib.play{color:var(--acc)}
.heart{border:0;background:none;color:var(--heartoff);font-size:19px;padding:4px 5px;line-height:1}
.heart.on{color:var(--heart)}
.hide{border:0;background:none;color:var(--heartoff);font-size:16px;padding:4px 5px;line-height:1}
.hide:hover{color:var(--red)}
.empty{color:var(--mut);padding:14px 0;font-size:15px}
@media (max-width:520px){ .trk .racts .hide,.trk .racts [data-add]{display:none} .trk.inpl .racts [data-mv]{display:none} }

/* Kort i sidled */
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:4px 0 10px}
.hscroll::-webkit-scrollbar{display:none}
.mini{flex:none;width:156px;background:var(--bg);border:1px solid var(--line);border-top:4px solid var(--g,var(--line));border-radius:8px;padding:10px;cursor:pointer}
.mini .cov{width:100%;height:auto;aspect-ratio:1;font-size:40px;margin-bottom:8px}
.mini .t{font-size:15px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini .m{font-size:13px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mact{display:flex;justify-content:space-between;margin-top:6px}
.rowhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:14px 0 4px}
.rowhead b{font-size:16px}
.rowhead .lnks{display:flex;gap:14px;flex:none}

.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 14px;font-size:15px;color:var(--ink);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
@media (prefers-color-scheme: dark){ .btn.pri{color:#1B1D42} }
.btn.sm{padding:5px 10px;font-size:14px}
.btn:disabled{opacity:.5}
.lnk{border:0;background:none;padding:4px 0;font-size:15px;color:var(--acc)}
.links{display:flex;flex-wrap:wrap;align-items:center;gap:4px 18px;margin:10px 0 4px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tag{border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:14px;padding:5px 12px;border-radius:999px;white-space:nowrap}
.tag.on{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:700}
.tag .x{margin-left:6px;color:var(--faint)}
.tag i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--g)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.seg{display:flex;gap:22px;margin-top:12px}
.seg button{border:0;background:none;padding:4px 0;font-size:15px;color:var(--mut);border-bottom:2px solid transparent}
.seg button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--acc)}

label.f{display:block;font-size:14px;color:var(--mut);margin:14px 0 6px}
input[type=text],input[type=password],input[type=search],select,textarea{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:16px}
.fold-body input[type=text],.fold-body input[type=password],.fold-body select{background:var(--bg)}
.inl{position:relative;margin-top:6px}
.inl input{padding-right:46px}
.inl .go{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--acc);font-size:20px;padding:4px 8px}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.hint{font-size:14px;color:var(--mut);margin-top:6px;line-height:1.45}
.hint code,.code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 6px;word-break:break-all}
ol.steps{padding-left:20px;margin:8px 0;font-size:15px}
ol.steps li{margin:6px 0}
.banner{background:var(--accbg);border-radius:10px;padding:12px 14px;margin:14px 0 0;font-size:15px}
.banner b{display:block;margin-bottom:2px}
.warnbox{background:rgba(176,74,62,.12);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14px;margin:10px 0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.ai-out{white-space:pre-wrap;line-height:1.55;font-size:16px;margin-top:10px}

/* Spelare */
#pbar{position:fixed;left:0;right:0;bottom:var(--navh);z-index:6;max-width:760px;margin:0 auto;background:var(--band2);color:var(--bandtxt);display:flex;align-items:center;gap:10px;padding:8px 10px 8px 8px;border-radius:12px 12px 0 0}
#pbar .cov{width:44px;height:44px;font-size:16px}
#pbar .pbt{flex:1;min-width:0;cursor:pointer}
#pbar .pbt b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pbar .pbt span{display:block;font-size:13px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pbar .ib{color:var(--bandtxt)}
#pbar .ib:hover{background:rgba(255,255,255,.15)}
#pbar .heart{font-size:18px}
#pbar .heart:not(.on){color:rgba(255,255,255,.45)}
#pbar .big svg{width:28px;height:28px}
.dev{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.dev .grow{flex:1}
.dev .m{font-size:14px;color:var(--mut)}
.dev.on b{color:var(--acc)}
input[type=range]{width:100%;accent-color:var(--acc)}

/* Detaljvy */
.sheetbg{position:fixed;inset:0;background:rgba(20,22,50,.4);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:90vh;overflow:auto;background:var(--bg);border-radius:14px 14px 0 0;padding:10px 22px calc(26px + var(--safe-b));transform:translateY(100%);transition:transform .25s ease;max-width:760px;margin:0 auto}
.sheet.open{transform:none}
@media (prefers-reduced-motion: reduce){.sheet{transition:none}}
.sheet .grab{width:36px;height:4px;background:var(--line);border-radius:2px;margin:4px auto 14px}
#sheetx{position:sticky;top:0;float:right;z-index:2}
.sheet h3{font-size:24px;font-weight:700;margin:2px 0 4px;line-height:1.2}
.hero{display:flex;gap:16px;align-items:flex-end;margin-bottom:6px}
.hero .cov{width:120px;height:120px;font-size:46px;border-radius:8px}
.hero .m{color:var(--mut);font-size:15px}
.hero .m a{color:var(--ink);cursor:pointer}
.pick{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:16px}
.pick .m{font-size:14px;color:var(--mut);margin-left:auto}

.toast{position:fixed;left:50%;bottom:calc(var(--navh) + 70px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:15px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;pointer-events:auto}
.toastbtn{border:0;background:none;color:var(--bg);font-weight:700;text-decoration:underline;margin-left:10px;padding:0}
.plhead{display:flex;align-items:center;gap:10px;margin:16px 0 4px}
.plhead h2{margin:0;flex:1}
.demo{font-size:14px;color:var(--faint);margin:24px 0 0}
</style>
</head>
<body>
<header>
  <div class="hdrrow"><h1>Min musik</h1><button class="hdrbtn" id="refresh" title="Hämta nya tips" aria-label="Hämta nya tips">↻</button><button class="hdrbtn" id="spbtn"></button></div>
  <div class="sub" id="sub"></div>
</header>
<main id="app"></main>
<div id="pbar" hidden></div>
<nav class="bottom">
  <button data-r="tips">Tips</button>
  <button data-r="listor">Spellistor</button>
  <button data-r="sok">Sök</button>
  <button data-r="mitt">Mitt</button>
  <button data-r="installningar">Inställningar</button>
</nav>
<div class="sheetbg" id="sheetbg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><button class="btn sm" id="sheetx" aria-label="Stäng">✕</button><div id="sheetc"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
/* =========================================================
   Min musik – fristående musikapp (systerapp till Min tablå)
   Spotify (sök, uppspelning, spellistor) · Last.fm (liknande musik) · AI (valfritt)
   Allt sparas lokalt i webbläsaren.
   ========================================================= */
const VERSION = "0.2";
const DEFAULT_SP_CLIENT = "36eaecd7df7e4ffdacb2e6707f48e22d"; // Spotify-appen "Min musik" (rydellfilm.github.io/min-musik)
const $ = (s, r=document) => r.querySelector(s), $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
  .replace(/\s*[\(\[][^\)\]]*(remaster|version|live|edit|mix|mono|stereo|feat)[^\)\]]*[\)\]]/g,"")
  .replace(/\s+-\s+.*(remaster|version|live|edit|mix|mono|stereo).*$/,"").replace(/&/g," and ").replace(/[^a-z0-9]+/g," ").trim();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => Math.random().toString(36).slice(2, 10);
const DAY = 864e5;
const IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const fmtDur = ms => { if (!ms) return ""; const s = Math.round(ms/1000); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
const fmtLen = ms => { const m = Math.round(ms/60000); return m < 60 ? m + " min" : Math.floor(m/60) + " h " + (m%60) + " min"; };
const hue = s => { let h = 0; for (const c of String(s)) h = (h*31 + c.charCodeAt(0)) % 360; return h; };
async function pmap(arr, n, fn){ const out = new Array(arr.length); let i = 0; await Promise.all(Array.from({length: Math.min(n, arr.length)}, async () => { while (i < arr.length){ const j = i++; try { out[j] = await fn(arr[j], j); } catch(e){ out[j] = null; } } })); return out; }
function openUrl(u){ const a = document.createElement("a"); a.href = u; a.target = "_blank"; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove(); }

const IC = {
  play:'<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  next:'<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M6 6l8.5 6L6 18zM16 6h2v12h-2z"/></svg>',
  prev:'<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M18 6l-8.5 6L18 18zM6 6h2v12H6z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>',
  spk:'<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  shuf:'<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 7h3c4 0 6 10 10 10h3M4 17h3c1.5 0 2.6-1.4 3.6-3M14 9.5C15 8 16 7 17 7h3M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>',
};

/* ---------- Genrer ---------- */
const GENRES = {
  pop:{n:"Pop",c:"#C0506A",lfm:"pop",sp:"pop"}, rock:{n:"Rock",c:"#B04A3E",lfm:"rock",sp:"rock"},
  indie:{n:"Indie",c:"#7B5EA7",lfm:"indie",sp:"indie"}, visa:{n:"Visa & singer-songwriter",c:"#D8962B",lfm:"singer-songwriter",sp:"singer-songwriter"},
  jazz:{n:"Jazz",c:"#2E9AA6",lfm:"jazz",sp:"jazz"}, soul:{n:"Soul & R&B",c:"#A2603A",lfm:"soul",sp:"soul"},
  elektroniskt:{n:"Elektroniskt",c:"#3E7CC0",lfm:"electronic",sp:"electronic"}, film:{n:"Filmmusik",c:"#5A6B8C",lfm:"soundtrack",sp:"soundtrack"},
  klassiskt:{n:"Klassiskt & modern klassisk",c:"#6F7F4A",lfm:"modern classical",sp:"classical"}, country:{n:"Country & americana",c:"#9A7B3C",lfm:"americana",sp:"country"},
  svenskt:{n:"Svenskt",c:"#3F7D55",lfm:"swedish",sp:"swedish pop"},
};
const gcol = t => t && t.g && GENRES[t.g] ? GENRES[t.g].c : "var(--line)";

/* ---------- Demokatalog (används när varken Spotify eller Last.fm är anslutna) ---------- */
const DEMO = [
["ABBA","pop svenskt","Dancing Queen|The Winner Takes It All|Mamma Mia"],
["Roxette","pop rock svenskt","The Look|It Must Have Been Love|Listen to Your Heart"],
["Robyn","pop elektroniskt svenskt","Dancing On My Own|Call Your Girlfriend|With Every Heartbeat"],
["Lykke Li","indie pop svenskt","I Follow Rivers|Little Bit"],
["First Aid Kit","visa country indie svenskt","Emmylou|My Silver Lining|The Lion's Roar"],
["Veronica Maggio","pop svenskt","Jag kommer|Måndagsbarn|Hela huset"],
["Håkan Hellström","rock indie svenskt","Känn ingen sorg för mig Göteborg|Det kommer aldrig va över för mig"],
["Kent","rock indie svenskt","Kärleken väntar|Dom andra"],
["Laleh","pop visa svenskt","Some Die Young|Goliat"],

/* Cache med livslängd */
let CACHE = {}; try { CACHE = JSON.parse(localStorage.getItem(CACHEKEY)) || {}; } catch(e){}
let cacheTimer;
function cget(k){ const e = CACHE[k]; if (!e) return undefined; if (e.x && e.x < Date.now()){ delete CACHE[k]; return undefined; } return e.v; }
function cset(k, v, ttl){ CACHE[k] = {v, x: ttl ? Date.now() + ttl : 0}; clearTimeout(cacheTimer); cacheTimer = setTimeout(flushCache, 800); }
function flushCache(){
  let keys = Object.keys(CACHE);
  if (keys.length > 1500){ keys.sort((a, b) => (CACHE[a].x||0) - (CACHE[b].x||0)).slice(0, keys.length - 1200).forEach(k => delete CACHE[k]); }
  try { localStorage.setItem(CACHEKEY, JSON.stringify(CACHE)); } catch(e){ CACHE = {}; try { localStorage.removeItem(CACHEKEY); } catch(_){} }
}
async function cached(k, ttl, fn){ const c = cget(k); if (c !== undefined) return c; const v = await fn(); if (v != null && (!Array.isArray(v) || v.length)) cset(k, v, ttl); return v; }
function clearRecCache(){ for (const k of Object.keys(CACHE)) if (/^(sa|tt|st|gt):/.test(k)) delete CACHE[k]; flushCache(); RECS.at = 0; }

/* =========================================================
   Spotify – inloggning med PKCE (ingen server behövs)
   ========================================================= */
const SP_REDIRECT = location.origin + location.pathname;
const SCOPES = "user-read-private streaming user-read-playback-state user-modify-playback-state user-read-currently-playing playlist-read-private playlist-read-collaborative playlist-modify-private playlist-modify-public user-top-read user-library-read user-library-modify";
let TOK = null; try { TOK = JSON.parse(localStorage.getItem(TOKKEY)); } catch(e){}
const SP = {me:null, webId:null, player:null, sdkLoading:false};
const spOn = () => !!(TOK && TOK.refresh);
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
function saveTok(){ try { if (TOK) localStorage.setItem(TOKKEY, JSON.stringify(TOK)); else localStorage.removeItem(TOKKEY); } catch(e){} }
function setTok(j){ TOK = {access:j.access_token, refresh:j.refresh_token || (TOK && TOK.refresh), exp:Date.now() + (j.expires_in || 3600) * 1000}; saveTok(); }

async function spLogin(){
  const id = S().spClientId.trim();
  if (!id){ toast("Fyll i ditt Spotify Client ID först."); go("installningar"); return; }
  if (location.protocol === "file:"){ toast("Spotify-inloggning kräver att appen öppnas från en webbadress (https eller http://127.0.0.1). Se Inställningar."); return; }
  if (!crypto.subtle){ toast("Webbläsaren saknar säker kontext (https) – inloggning går inte här."); return; }
  const v = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const c = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(v)));
  const st = b64url(crypto.getRandomValues(new Uint8Array(12)));
  localStorage.setItem("minmusik.pkce", JSON.stringify({v, st, redirect:SP_REDIRECT, id}));
  const url = "https://accounts.spotify.com/authorize?" + new URLSearchParams({client_id:id, response_type:"code", redirect_uri:SP_REDIRECT, code_challenge_method:"S256", code_challenge:c, state:st, scope:SCOPES});
  if (window.top !== window){ const w = window.open(url, "spauth", "width=480,height=760"); if (!w) location.href = url; }
  else location.href = url;
}
async function spCallback(){
  const q = new URLSearchParams(location.search);
  if (!q.has("code") && !q.has("error")) return;
  history.replaceState(null, "", location.pathname + location.hash);
  if (q.get("error")){ toast("Spotify: " + (q.get("error") === "access_denied" ? "inloggningen avbröts" : q.get("error"))); return; }
  let p = null; try { p = JSON.parse(localStorage.getItem("minmusik.pkce")); } catch(e){}
  if (!p || p.st !== q.get("state")){ toast("Inloggningen kunde inte verifieras – försök igen."); return; }
  try {
    const r = await fetch("https://accounts.spotify.com/api/token", {method:"POST", headers:{"content-type":"application/x-www-form-urlencoded"},
      body:new URLSearchParams({grant_type:"authorization_code", code:q.get("code"), redirect_uri:p.redirect, client_id:p.id, code_verifier:p.v})});
    const j = await r.json();
    if (!r.ok){ toast("Spotify: " + (j.error_description || j.error)); return; }
    setTok(j); localStorage.removeItem("minmusik.pkce");
    if (window.opener){ try { window.opener.postMessage({mmTok:TOK}, location.origin); } catch(e){} window.close(); }
    toast("Ansluten till Spotify.");
  } catch(e){ toast("Kunde inte nå Spotify: " + e.message); }
}
window.addEventListener("message", e => { if (e.origin === location.origin && e.data && e.data.mmTok){ TOK = e.data.mmTok; saveTok(); spConnected(); } });
window.addEventListener("storage", e => { if (e.key === TOKKEY){ try { TOK = JSON.parse(e.newValue); } catch(_){} if (spOn()) spConnected(); } });

function spLogout(silent){
  TOK = null; saveTok(); SP.me = null; NOW = null; SP.webId = null;
  try { SP.player && SP.player.disconnect(); } catch(e){} SP.player = null; SP.sdkLoading = false;
  if (!silent) toast("Spotify bortkopplat."); render(); renderPbar();
}
async function spToken(){
  if (!TOK) return null;
  if (Date.now() < TOK.exp - 60e3) return TOK.access;
  try {
    const r = await fetch("https://accounts.spotify.com/api/token", {method:"POST", headers:{"content-type":"application/x-www-form-urlencoded"},
      body:new URLSearchParams({grant_type:"refresh_token", refresh_token:TOK.refresh, client_id:S().spClientId.trim()})});
    if (!r.ok){ spLogout(true); toast("Spotify-inloggningen har gått ut – anslut igen under Inställningar."); return null; }
    setTok(await r.json()); return TOK.access;
  } catch(e){ return null; }
}
async function sp(path, {method = "GET", body} = {}){
  let tok = await spToken(); if (!tok){ const e = new Error("Inte ansluten till Spotify"); e.status = 0; throw e; }
  for (let i = 0; i < 3; i++){
    const r = await fetch(path.startsWith("http") ? path : "https://api.spotify.com/v1" + path,
      {method, headers:{authorization:"Bearer " + tok, ...(body ? {"content-type":"application/json"} : {})}, body: body ? JSON.stringify(body) : undefined});
    if (r.status === 429){ await sleep(Math.min(10, +r.headers.get("retry-after") || 2) * 1000); continue; }
    if (r.status === 401 && i === 0){ TOK.exp = 0; tok = await spToken(); if (!tok) break; continue; }
    if (r.status === 204 || r.status === 202) return null;
    const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch(e){}
    if (!r.ok){ const err = new Error((j && j.error && (j.error.message || j.error)) || ("HTTP " + r.status)); err.status = r.status; err.reason = j && j.error && j.error.reason; throw err; }
    return j;
  }
  const e = new Error("Spotify svarar inte just nu"); e.status = 429; throw e;
}
const pickImg = im => { if (!im || !im.length) return ""; const s = [...im].sort((a, b) => (a.width||0) - (b.width||0)); return (s.find(i => (i.width||0) >= 200) || s[s.length-1]).url; };
function fromSp(t){
  if (!t || !t.name) return null;
  return reg({name:t.name, artist:(t.artists||[]).map(a => a.name).join(", "), mainArtist:t.artists && t.artists[0] && t.artists[0].name,
    album:t.album && t.album.name, img:pickImg(t.album && t.album.images), id:t.id, uri:t.uri, url:t.external_urls && t.external_urls.spotify, dur:t.duration_ms});
}

/* Matcha en låt (från Last.fm, AI eller demo) mot Spotify */
async function resolve(t){
  if (!t || t.uri) return t;
  const k = tk(t), c = cget("res:" + k);
  if (c){ if (!c.none){ Object.assign(t, c); reg(t); } return t; }
  if (!spOn()) return t;
  const art = t.mainArtist || t.artist;
  const score = x => { const a = norm(x.name), b = norm(t.name), A = norm(x.mainArtist), B = norm(art);
    return (a === b ? 2 : (a.includes(b) || b.includes(a)) ? 1 : 0) + (A === B ? 2 : (A.includes(B) || B.includes(A)) ? 1 : 0); };
  try {
    let j = await sp(`/search?type=track&limit=5&q=${encodeURIComponent(`track:${t.name.replace(/"/g,"")} artist:${art.replace(/"/g,"")}`)}`);
    let items = ((j && j.tracks && j.tracks.items) || []).map(fromSp).filter(Boolean);
    if (!items.some(x => score(x) >= 3)){ j = await sp(`/search?type=track&limit=5&q=${encodeURIComponent(t.name + " " + art)}`); items = items.concat(((j && j.tracks && j.tracks.items) || []).map(fromSp).filter(Boolean)); }
    const best = items.map(x => ({x, s:score(x)})).sort((a, b) => b.s - a.s)[0];
    if (best && best.s >= 3){ const keep = {id:best.x.id, uri:best.x.uri, url:best.x.url, img:best.x.img, album:best.x.album, dur:best.x.dur}; cset("res:" + k, keep, 60*DAY); Object.assign(t, keep); reg(t); }
    else cset("res:" + k, {none:1}, 14*DAY);
  } catch(e){}
  return t;
}

const IMGQ = new Set(); let imgRunning = false;
function fillImages(){
  $$("[data-needimg]").forEach(el => { const t = TR.get(el.dataset.needimg); const c = t && cget("res:" + tk(t)); if (t && (t.img || (c && c.img))){ if (c && c.img) Object.assign(t, c); setCov(el, t); } else if (spOn()) IMGQ.add(el.dataset.needimg); });
  if (!imgRunning && IMGQ.size) runImgQ();
}
function setCov(el, t){ el.classList.remove("ph"); el.removeAttribute("data-needimg"); el.innerHTML = `<img src="${esc(t.img)}" alt="" loading="lazy">`; }
async function runImgQ(){
  imgRunning = true;
  while (IMGQ.size){
    const batch = [...IMGQ].slice(0, 3); batch.forEach(k => IMGQ.delete(k));
    await Promise.all(batch.map(async k => { const t = TR.get(k); if (!t) return; await resolve(t); if (t.img) $$(`[data-needimg="${CSS.escape(k)}"]`).forEach(el => setCov(el, t)); }));
  }
  imgRunning = false;
}

/* ---------- Spotify-spelaren i webbläsaren (Web Playback SDK, dator) ---------- */
function loadSDK(){
  if (IS_MOBILE || SP.sdkLoading || !spOn()) return; SP.sdkLoading = true;
  window.onSpotifyWebPlaybackSDKReady = () => {
    const p = new Spotify.Player({name:"Min musik (webbläsare)", getOAuthToken: cb => spToken().then(t => t && cb(t)), volume:0.8});
    p.addListener("ready", ({device_id}) => { SP.webId = device_id; });
    p.addListener("not_ready", () => { SP.webId = null; });
    p.addListener("player_state_changed", s => { if (s && s.track_window && s.track_window.current_track) nowFromSdk(s); });
    p.addListener("authentication_error", ({message}) => console.warn("SDK auth", message));
    p.addListener("account_error", () => toast("Uppspelning i webbläsaren kräver Spotify Premium."));
    p.addListener("initialization_error", ({message}) => console.warn("SDK init", message));
    p.connect(); SP.player = p;
  };
  const s = document.createElement("script"); s.src = "https://sdk.scdn.co/spotify-player.js"; s.async = true; document.head.appendChild(s);
}

/* ---------- Uppspelning ---------- */
let NOW = null, PENDING = null;
async function playTracks(list, startIdx = 0){
  list = (list || []).filter(Boolean); if (!list.length) return;
  if (!spOn()){ openUrl(spUrl(list[startIdx] || list[0])); toast("Öppnar i Spotify. Anslut Spotify under Inställningar så spelas musiken direkt i appen."); addRecent(list[startIdx] || list[0]); return; }
  try { SP.player && SP.player.activateElement && SP.player.activateElement(); } catch(e){}
  const slice = list.slice(startIdx, startIdx + 100);
  if (slice.length > 1) toast(`Förbereder ${slice.length} låtar…`);
  const res = await pmap(slice, 4, resolve);
  const uris = res.filter(t => t && t.uri).map(t => t.uri);
  if (!uris.length){ toast("Hittade inte låten på Spotify."); return; }
  await spPlay({uris});
  addRecent(slice[0]);
}
function findPref(list){
  const s = S(); if (!s.deviceId && !s.deviceName) return null;
  if (s.deviceId === "web") return SP.webId ? {id:SP.webId} : null;
  return list.find(x => x.id === s.deviceId) || list.find(x => s.deviceName && x.name && x.name.toLowerCase() === s.deviceName.toLowerCase()) || null;
}
async function getDevices(){
  let list = [];
  try { const d = await sp("/me/player/devices"); list = (d && d.devices) || []; } catch(e){}
  if (SP.webId && !list.some(d => d.id === SP.webId)) list.unshift({id:SP.webId, name:"Den här webbläsaren", type:"Computer", web:true});
  list.forEach(d => { if (d.id === SP.webId){ d.web = true; d.name = "Den här webbläsaren"; } });
  return list;
}
async function pickDevice(){
  let list = [];
  try { const d = await sp("/me/player/devices"); list = (d && d.devices) || []; } catch(e){}
  const pref = findPref(list); if (pref) return pref.id;
  const act = list.find(x => x.is_active); if (act) return act.id;
  if (SP.webId && !S().deviceName) return SP.webId;
  if (S().deviceName) return null;   // standardenheten syns inte – låt användaren välja
  if (SP.webId) return SP.webId;
  if (list.length === 1) return list[0].id;
  return null;
}
async function spPlay(body, deviceId){
  const dev = deviceId || await pickDevice();
  if (!dev){ PENDING = body; openDevices(); return; }
  try { await sp(`/me/player/play?device_id=${encodeURIComponent(dev)}`, {method:"PUT", body}); PENDING = null; setTimeout(pollNow, 900); setTimeout(pollNow, 2500); }
  catch(e){
    if (e.status === 404 || e.reason === "NO_ACTIVE_DEVICE"){ PENDING = body; openDevices(); }
    else if (e.status === 403) toast("Spotify tillåter inte uppspelningen här (kräver Premium).");
    else toast("Spotify: " + e.message);
  }
}
async function pc(cmd){
  if (!spOn()) return;
  const web = NOW && NOW.dev && NOW.dev.id && NOW.dev.id === SP.webId && SP.player;
  try {
    if (cmd === "toggle"){
      if (web) await SP.player.togglePlay();
      else if (NOW && NOW.playing) await sp("/me/player/pause", {method:"PUT"});
      else { const dev = await pickDevice(); if (!dev){ openDevices(); return; } await sp("/me/player/play?device_id=" + dev, {method:"PUT"}); }
      if (NOW) NOW.playing = !NOW.playing; renderPbar();
    }
    if (cmd === "next") web ? await SP.player.nextTrack() : await sp("/me/player/next", {method:"POST"});
    if (cmd === "prev") web ? await SP.player.previousTrack() : await sp("/me/player/previous", {method:"POST"});
    setTimeout(pollNow, 700);
  } catch(e){ if (e.status === 404) openDevices(); else toast("Spotify: " + e.message); }
}
async function pollNow(){
  if (!spOn() || document.hidden) return;
  try {
    const j = await sp("/me/player?additional_types=track");
    if (j && j.item){ const was = NOW && NOW.t && NOW.t.uri; NOW = {t:fromSp(j.item), playing:j.is_playing, dev:j.device}; if (was !== NOW.t.uri) markNow(); }
    else if (!j) NOW = null;
    renderPbar();
  } catch(e){}
}

    playing:!s.paused, dev:{id:SP.webId, name:"Den här webbläsaren", volume_percent:null}};

}

async function artistTopTracks(name, n = 5){

      const a = ((j && j.tracks && j.tracks.items) || []).map(fromSp).filter(t => t && norm(t.mainArtist) === norm(name)); if (a.length) return a.map(slim); } catch(e){} }

/* ---------- Rekommendationsmotor ---------- */
let RECS = {groups:[], list:[], genre:{}, at:0, sig:"", busy:false};
try { const r = JSON.parse(localStorage.getItem(RECKEY)); if (r){ RECS = Object.assign(RECS, r, {busy:false}); RECS.groups.forEach(g => g.tracks = g.tracks.map(reg)); RECS.list.forEach(x => x.t = reg(x.t)); for (const g in RECS.genre) RECS.genre[g] = RECS.genre[g].map(reg); } } catch(e){}
const recSig = () => JSON.stringify([state.favorites.map(f => f.type + f.name + (f.artist||"")), state.favGenres, Object.keys(state.liked).slice(-5), !!S().lfmKey, spOn(), aiOn()]);
async function buildRecs(force){
  if (RECS.busy) return;
  if (!force && RECS.sig === recSig() && Date.now() - RECS.at < 12*3600e3) return;
  RECS.busy = true; if (state.route === "tips") render();
  try {
    const pool = new Map(), groups = [], genre = {};
    const add = (t, s, reason) => { const k = tk(t); if (isHidden(k) || state.liked[k]) return; const e = pool.get(k) || {t, score:0, reason, n:0}; e.score += s; e.n++; if (!e.reason) e.reason = reason; pool.set(k, e); };
    await pmap(state.favorites.slice(0, 15), 2, async f => {
      if (f.type === "artist"){
        const sims = (await similarArtists(f.name)).slice(0, 8);
        const tops = await pmap(sims, 3, a => artistTopTracks(a.name, 2));
        const tracks = [];
        tops.forEach((l, i) => (l || []).forEach((t, j) => { tracks.push(t); add(t, 5 - i*.4 - j, `Liknar ${f.name}`); }));
        groups.push({fav:f, title:`Liknar ${f.name}`, tracks:tracks.filter(t => !isHidden(tk(t)))});
      } else {
        const tt = await similarTracks({name:f.name, artist:f.artist, mainArtist:f.artist});
        tt.forEach((t, i) => add(t, 5 - Math.min(4, i*.15), `Liknar ${f.name}`));
        groups.push({fav:f, title:`Liknar ${f.name} (${f.artist})`, tracks:tt.filter(t => !isHidden(tk(t))).slice(0, 14)});
      }
    });
    const seeds = Object.values(state.liked).slice(-5);
    await pmap(seeds, 2, async s => { (await similarTracks(s)).slice(0, 12).forEach((t, i) => add(t, 3 - i*.1, `För att du gillade ${s.name}`)); });
    await pmap(state.favGenres, 2, async g => { const l = await genreTracks(g); genre[g] = l.filter(t => !isHidden(tk(t))).slice(0, 14); l.slice(0, 20).forEach((t, i) => add(t, 1.6 - i*.03, `Du gillar ${GENRES[g].n.toLowerCase()}`)); });
    const shown = state.tipShown || {};
    for (const e of pool.values()){ if (e.n > 1) e.score += e.n; const sh = shown[tk(e.t)]; if (sh && Date.now() - sh.last < 10*DAY) e.score -= Math.min(6, Math.max(0, sh.n - 2) * 1.5); }
    const order = state.favorites.map(f => f.type + f.name);
    groups.sort((a, b) => order.indexOf(a.fav.type + a.fav.name) - order.indexOf(b.fav.type + b.fav.name));
    RECS = {groups, list:[...pool.values()].sort((a, b) => b.score - a.score).slice(0, 120), genre, at:Date.now(), sig:recSig(), busy:false};
    try { localStorage.setItem(RECKEY, JSON.stringify({groups:groups.map(g => ({...g, tracks:g.tracks.map(slim)})), list:RECS.list.map(x => ({...x, t:slim(x.t)})), genre:Object.fromEntries(Object.entries(genre).map(([k, v]) => [k, v.map(slim)])), at:RECS.at, sig:RECS.sig})); } catch(e){}
  } catch(e){ console.warn(e); RECS.busy = false; }
  RECS.busy = false;
  if (state.route === "tips") render();
}
function markShown(list){ const sh = state.tipShown || (state.tipShown = {}), today = new Date().toDateString(); list.forEach(t => { const k = tk(t), e = sh[k] || {n:0, last:0}; if (new Date(e.last).toDateString() !== today){ e.n++; e.last = Date.now(); } sh[k] = e; }); const ks = Object.keys(sh); if (ks.length > 600) ks.slice(0, ks.length - 500).forEach(k => delete sh[k]); }

async function searchAll(q){
  q = q.trim(); if (!q) return {tracks:[], artists:[]};
  return cached("sr:" + (spOn() ? "s" : S().lfmKey ? "l" : "d") + ":" + norm(q), DAY, async () => {
    if (spOn()){
      const [a, b] = await Promise.all([sp(`/search?type=track&limit=10&q=${encodeURIComponent(q)}`), sp(`/search?type=track&limit=10&offset=10&q=${encodeURIComponent(q)}`).catch(() => null)]);
      const ar = await sp(`/search?type=artist&limit=10&q=${encodeURIComponent(q)}`);
      return {tracks:[...((a && a.tracks.items) || []), ...((b && b.tracks.items) || [])].map(fromSp).filter(Boolean).map(slim), artists:((ar && ar.artists.items) || []).map(x => ({name:x.name, img:pickImg(x.images), genres:(x.genres || []).slice(0, 3)}))};
    }
    if (S().lfmKey){
      const [a, b] = await Promise.all([lfm("track.search", {track:q, limit:20}), lfm("artist.search", {artist:q, limit:10})]);
      return {tracks:arr(a && a.results && a.results.trackmatches.track).map(x => ({name:x.name, artist:x.artist, mainArtist:x.artist})), artists:arr(b && b.results && b.results.artistmatches.artist).map(x => ({name:x.name}))};
    }
    const n = norm(q);
    return {tracks:DEMO_TRACKS.filter(t => norm(t.name).includes(n) || norm(t.artist).includes(n)), artists:DEMO.filter(a => norm(a.name).includes(n)).map(a => ({name:a.name, genres:a.genres.map(g => GENRES[g].n)}))};
  });
}

  if (SEARCH.busy && !SEARCH.res) return `<div class="empty"><span class="spin"></span>Söker…</div>`;
  const r = SEARCH.res || {tracks:[], artists:[]};
  if (SEARCH.mode === "artist") return r.artists.length ? r.artists.map(a => `<div class="trk" data-artist="${esc(a.name)}" style="--g:var(--line)">${a.img ? `<div class="cov" style="border-radius:50%"><img src="${esc(a.img)}" alt=""></div>` : `<div class="cov" style="--h:${hue(a.name)};border-radius:50%">${esc(a.name[0])}</div>`}

  return r.tracks.length ? trackList(r.tracks.map(t => reg({...t})), {noHide:true}) : `<div class="empty">Inga låtar hittades.</div>`;
}
let sTimer;
function doSearch(q, targetSel = "#sres", plId){

/* ---------- Egna dialoger (ersätter prompt/confirm) ---------- */
function askText(title, def = "", ok = "Spara"){
  return new Promise(res => {
    openSheet(`<h3>${esc(title)}</h3><input type="text" id="askv" value="${esc(def)}" enterkeyhint="done"><div class="acts"><button class="btn pri" id="askok">${esc(ok)}</button><button class="btn" id="askno">Avbryt</button></div>`);
    const i = $("#askv"); setTimeout(() => { i.focus(); i.select(); }, 50);
    const done = v => { $("#sheet").removeEventListener("sheetclose", cancel); closeSheet(); res(v); };
    const cancel = () => res(null);
    $("#sheet").addEventListener("sheetclose", cancel, {once:true});
    $("#askok").onclick = () => done(i.value.trim() || null);
    $("#askno").onclick = () => done(null);
    i.onkeydown = e => { if (e.key === "Enter"){ e.preventDefault(); e.stopPropagation(); done(i.value.trim() || null); } };
  });
}
function askYes(title, text, ok = "Ja"){
  return new Promise(res => {
    openSheet(`<h3>${esc(title)}</h3><p>${esc(text)}</p><div class="acts"><button class="btn pri" id="askok">${esc(ok)}</button><button class="btn" id="askno">Avbryt</button></div>`);
    $("#sheet").addEventListener("sheetclose", () => res(false), {once:true});
    $("#askok").onclick = () => { res(true); closeSheet(); };
    $("#askno").onclick = () => { res(false); closeSheet(); };
  });
}

async function openArtist(name){
  openSheet(`<h3>${esc(name)}</h3>
    <div class="acts"><button class="btn pri" data-artplay="${esc(name)}">${IC.play} Spela</button><button class="btn" data-favartist="${esc(name)}">${isFavArtist(name) ? "♥ Favorit ✓" : "♥ Lägg till som favorit"}</button><button class="btn" data-radio="${esc(name)}">Gör radio-spellista</button></div>

  fillImages();
}

  if (t.id === "radiogo") return radioFromInput();
  if (t.id === "aiplgo") return aiPlaylist();
  if (t.id === "refresh"){ clearRecCache(); TIP_SKIP = 0; toast("Hämtar nya tips…"); if (state.route !== "tips") go("tips"); buildRecs(true); return; }
  if (t.id === "spbtn") return spOn() ? openDevices() : (S().spClientId ? spLogin() : go("installningar"));
});
function quickAdd(){ const v = $("#qsArtist").value.trim(); if (!v) return; if (!isFavArtist(v)){ state.favorites.push({type:"artist", name:v}); save(); } $("#qsArtist").value = ""; render(); buildRecs(true); toast(`${v} tillagd – lägg gärna till fler`); }
function favAdd(){
  if (state.favType === "låt"){ const n = $("#favSong").value.trim(), a = $("#favSongArtist").value.trim(); if (!n || !a){ toast("Fyll i både låt och artist."); return; } addFavSong({name:n, artist:a, mainArtist:a}); render(); return; }
  const v = $("#favName").value.trim(); if (!v) return; if (isFavArtist(v)){ toast("Finns redan"); return; }
  state.favorites.unshift({type:"artist", name:v}); save(); render(); buildRecs(true); toast(`${v} tillagd`); setTimeout(() => { const i = $("#favName"); i && i.focus(); }, 0);
}
function radioFromInput(){ const v = $("#radioq").value.trim(); if (v) artistRadio(v); }
async function aiPlaylist(){
  const q = $("#aiplq").value.trim(); if (!q) return;
  $("#aiplout").innerHTML = `<div class="empty"><span class="spin"></span>Sätter ihop spellistan…</div>`;
  try {
    const r = parseAI(await askAI(`${aiContext()}\n\nSkapa en spellista med cirka 20 låtar: ${q}`));
    if (!r.songs.length){ $("#aiplout").innerHTML = `<div class="ai-out">${esc(r.text || "Fick inga låtar tillbaka.")}</div>`; return; }
    const pl = newPlaylist(r.name || q, r.songs, {desc:q}); go("lista:" + pl.id); toast(`”${pl.name}” skapades med ${pl.tracks.length} låtar`);
  } catch(e){ $("#aiplout").innerHTML = `<div class="empty">AI-fel: ${esc(e.message)}</div>`; }
}
async function act(a){
  if (a === "splogin") return spLogin();
  if (a === "splogout") return spLogout();
  if (a === "topartists") return importTopArtists();
  if (a === "importsp") return importSpotifyLists();
  if (a === "newpl"){ const n = await askText("Ny spellista", "Ny spellista", "Skapa"); if (!n) return; const pl = newPlaylist(n.trim()); go("lista:" + pl.id); return; }
  if (a === "unhideall"){ const old = state.disliked; state.disliked = {}; save(); render(); toast("Alla dolda låtar visas igen", "Ångra", () => { state.disliked = old; save(); render(); }); return; }
  if (a === "copyredir"){ try { await navigator.clipboard.writeText(SP_REDIRECT); toast("Kopierad"); } catch(e){ toast(SP_REDIRECT); } return; }
  if (a === "clearcache"){ CACHE = {}; flushCache(); RECS.at = 0; toast("Tipscachen tömd"); return; }
  if (a === "export"){
    const c = JSON.parse(JSON.stringify(state)); c.settings = {...c.settings, aiKey:""};
    const b = new Blob([JSON.stringify({app:"minmusik", version:VERSION, savedAt:new Date().toISOString(), state:c}, null, 2)], {type:"application/json"});
    const u = URL.createObjectURL(b), l = document.createElement("a"); l.href = u; l.download = `min-musik-${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000);
    toast("Säkerhetskopia sparad (AI-nyckeln ingår inte)"); return;
  }
  if (a === "import") return $("#impfile").click();
  if (a === "reset"){ if (!await askYes("Återställ allt?", "Alla favoriter, spellistor och inställningar i den här webbläsaren raderas.", "Radera allt")) return; localStorage.removeItem(KEY); localStorage.removeItem(RECKEY); localStorage.removeItem(CACHEKEY); localStorage.removeItem(TOKKEY); location.reload(); }
}
document.addEventListener("change", async e => {
  const t = e.target;
  if (["spClientId","lfmKey","aiKey","aiModel","aiBase","aiProvider"].includes(t.id)){
    state.settings[t.id] = t.value.trim();
    if (t.id === "aiProvider") state.settings.aiModel = t.value === "anthropic" ? "claude-sonnet-5-5" : "gpt-4o-mini";
    if (t.id === "lfmKey" || t.id === "aiKey") clearRecCache();
    save(); render(); toast("Sparat");
  }
  if (t.id === "vol"){ try { await sp(`/me/player/volume?volume_percent=${t.value}`, {method:"PUT"}); if (NOW && NOW.dev) NOW.dev.volume_percent = +t.value; } catch(err){ toast("Kunde inte ändra volymen: " + err.message); } }
  if (t.id === "syncLibrary"){ state.settings.syncLibrary = t.checked; save(); }
  if (t.id === "impfile" && t.files[0]){
    try { const j = JSON.parse(await t.files[0].text()); const st = j.state || j; if (!st.playlists && !st.favorites) throw new Error("okänt format");
      const keepKey = state.settings.aiKey; state = Object.assign(defaults(), st); state.settings = Object.assign(defaults().settings, st.settings || {}, {aiKey: (st.settings && st.settings.aiKey) || keepKey});
      save(); RECS.at = 0; render(); toast(`Inläst: ${state.playlists.length} spellistor, ${state.favorites.length} favoriter`);
    } catch(err){ toast("Kunde inte läsa filen: " + err.message); }
    t.value = "";
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "sq") doSearch(t.value);
  if (t.id === "pladdq") doSearch(t.value, null, t.dataset.pl);
  if (t.id === "spClientId"){ const b = $('[data-act="splogin"]'); if (b) b.disabled = !t.value.trim(); }
});
document.addEventListener("keydown", e => {
  const inField = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if (e.key === "Enter" && inField){
    const id = e.target.id;
    if (id === "qsArtist") return quickAdd();
    if (id === "favName" || id === "favSongArtist") return favAdd();
    if (id === "aiq") return runAI(e.target.value.trim());
    if (id === "radioq") return radioFromInput();
    if (id === "aiplq") return aiPlaylist();
    if (id === "newplname") return $("[data-newpl]").click();
    if (id === "spClientId"){ e.target.blur(); }
  }
  if (e.key === "Escape" && $("#sheet").classList.contains("open")) return closeSheet();
  if (inField) return;
  if (e.key === " " && spOn() && NOW){ e.preventDefault(); pc("toggle"); }
  if (e.key === "/"){ e.preventDefault(); go("sok"); setTimeout(() => $("#sq") && $("#sq").focus(), 0); }
});

/* ---------- Start ---------- */
(async function init(){
  setNavH();
  render();
  await spCallback();
  if (spOn()) spConnected(); else render();
})();
</script>
</body>
</html>
